name: CI

on:
  push:
    branches:
      - main
      - "copilot/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server dependencies
        run: pip install -r requirements-server.txt

      - name: Run tests
        run: pytest
