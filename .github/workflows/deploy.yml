name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main   # ggf. auf 'master' ändern, wenn dein Haupt-Branch so heißt

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/SIA-web
            git pull origin main
            # Python-Dependencies aktualisieren (falls requirements.txt existiert)
            if [ -f requirements.txt ]; then
              python3 -m venv venv || true
              . venv/bin/activate
              pip install -r requirements.txt
              deactivate
            fi
            # Service neu starten (passen wir gleich an)
            sudo systemctl restart sia-web || systemctl restart sia-web
