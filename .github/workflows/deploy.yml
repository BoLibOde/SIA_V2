name: Deploy to Ubuntu Server via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy website and refresh database via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.74.7.35
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/deploy/SIA-web
            git fetch origin main
            git reset --hard origin/main

            chmod +x scripts/refresh_database.sh scripts/deploy_website.sh
            sudo bash scripts/refresh_database.sh

            if [ ! -f /var/www/html/stimmungsbarometer/db.local.php ]; then
              sudo mkdir -p /var/www/html/stimmungsbarometer
              sudo cp server/WEBSITE/db.local.example.php /var/www/html/stimmungsbarometer/db.local.php
              echo 'Created /var/www/html/stimmungsbarometer/db.local.php from example. Update the password on the server.'
            fi

            sudo bash scripts/deploy_website.sh

  deploy-device:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy to Raspberry Pi via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/Desktop/SIA_V2
            git fetch origin main
            git reset --hard origin/main

            if [ -f requirements-device.txt ] && [ -x .venv/bin/pip ]; then
              .venv/bin/pip install --quiet -r requirements-device.txt
            fi

            sudo systemctl restart sia-device
