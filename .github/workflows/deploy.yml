name: Deploy to Ubuntu Server via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy website via SSH over Tailscale
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          trap 'rm -f /tmp/deploy_key' EXIT
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -i /tmp/deploy_key deploy@100.74.7.35 << 'ENDSSH'
          set -e
          cd /home/deploy/SIA-web
          git fetch origin main
          git reset --hard origin/main

          chmod +x scripts/deploy_website.sh

          if [ ! -f /var/www/html/stimmungsbarometer/db.local.php ]; then
            sudo mkdir -p /var/www/html/stimmungsbarometer
            sudo cp server/WEBSITE/db.local.example.php /var/www/html/stimmungsbarometer/db.local.php
            echo 'Created /var/www/html/stimmungsbarometer/db.local.php from example. Update the password on the server.'
          fi

          sudo bash scripts/deploy_website.sh
          ENDSSH

  deploy-device:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy to Raspberry Pi via SSH over Tailscale
        run: |
          install -m 600 /dev/null /tmp/rpi_key
          echo "${{ secrets.RPI_SSH_KEY }}" > /tmp/rpi_key
          trap 'rm -f /tmp/rpi_key' EXIT
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -i /tmp/rpi_key ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }} << 'ENDSSH'
          set -e
          cd ~/Desktop/SIA_V2
          git fetch origin main
          git reset --hard origin/main

          if [ -f requirements-device.txt ] && [ -x .venv/bin/pip ]; then
            .venv/bin/pip install --quiet -r requirements-device.txt
          fi

          sudo systemctl restart sia-device
          ENDSSH
