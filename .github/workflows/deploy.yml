name: Deploy to Ubuntu Server via Tailscale

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy website via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.74.7.35
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /home/deploy/SIA-web
            git fetch origin main
            git reset --hard origin/main

            chmod +x scripts/deploy_website.sh

            if [ ! -f /var/www/html/stimmungsbarometer/db.local.php ]; then
              sudo mkdir -p /var/www/html/stimmungsbarometer
              sudo cp server/WEBSITE/db.local.example.php /var/www/html/stimmungsbarometer/db.local.php
              echo 'Created /var/www/html/stimmungsbarometer/db.local.php from example. Update the password on the server.'
            fi

            sudo bash scripts/deploy_website.sh

  deploy-device:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy to Raspberry Pi via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/Desktop/SIA_V2
            # Remove empty/corrupt git object files that can accumulate on the Pi
            # due to interrupted writes (e.g. power loss, disk full). These cause
            # 'git fetch' to abort with exit 128 ("object file is empty").
            EMPTY_OBJS=$(find .git/objects -type f -empty 2>/dev/null | wc -l)
            if [ "$EMPTY_OBJS" -gt 0 ]; then
              echo "Removing $EMPTY_OBJS empty git object(s) before fetch..."
              find .git/objects -type f -empty -delete
            fi
            git fetch origin main
            git reset --hard origin/main

            if [ -f requirements-device.txt ] && [ -x .venv/bin/pip ]; then
              .venv/bin/pip install --quiet -r requirements-device.txt
            fi

            # Clear stale buffered upload data so that old mood events from
            # previous runs are not re-uploaded to production after a deploy.
            # Any events that were never successfully sent will be lost, but
            # this is the safe default: fresh deploy = clean upload state.
            rm -f device/pending_uploads.json

            # Ensure the restart script is executable after every deploy.
            # The app runs via Desktop-Autostart (start_ui.sh), not systemd.
            # systemd is disabled for this Desktop-GUI setup.
            # Use ./restart manually on the Pi if an immediate restart is needed.
            chmod +x ~/Desktop/SIA_V2/restart
