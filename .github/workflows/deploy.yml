name: Deploy to Ubuntu Server via Tailscale

on:
  push:
    branches:
      - main   # ggf. anpassen, falls dein Haupt-Branch anders heißt (z.B. master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Mit deinem Tailnet verbinden (Tailscale)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # optional: caching beschleunigt spätere Läufe
          use-cache: true

      # 2) Deploy auf den Server über Tailscale-SSH
      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.74.7.35           # HIER: Tailscale-IP deiner Ubuntu-VM eintragen
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/deploy/SIA-web
            git pull origin main

            # Virtualenv + requirements-server.txt (optional, aber praktisch)
            if [ -f requirements-server.txt ]; then
              python3 -m venv venv || true
              . venv/bin/activate
              pip install -r requirements-server.txt
              deactivate
            fi

            # Service neu starten
            sudo systemctl restart sia-web || systemctl restart sia-web

  deploy-device:
    runs-on: ubuntu-latest
    needs: deploy   # starts only after server deployment succeeds

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: true

      - name: Deploy to Raspberry Pi via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/Desktop/SIA_V2
            git pull origin main

            # Update dependencies
            if [ -f requirements-device.txt ] && [ -x .venv/bin/pip ]; then
              .venv/bin/pip install --quiet -r requirements-device.txt
            fi

            # Restart device service
            sudo systemctl restart sia-device
